services:
  - type: web
    # Service identity matches this repo (not archived genesis)
    name: quantum-pi-forge-fixed
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: NODE_ENV
        value: production
      - key: API_BASE_URL
        value: http://localhost:8000
    healthCheckPath: /health
