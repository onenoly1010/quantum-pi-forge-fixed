name: Vercel Deployment Status Check

"on":
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vercel-check:
    runs-on: ubuntu-latest
    steps:
      - name: Skip blocked Vercel account
        run: |
          echo "Vercel status check skipped."
          echo "The linked Vercel account reports blocked, and this frontend lane does not deploy through Vercel."
          echo "This job is success so a dependency PR is not painted red by an account block."
          echo "NOT a deployment. NOT authorization to reconnect Vercel."
